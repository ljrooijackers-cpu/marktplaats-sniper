<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marktplaats Multi-Sniper</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
#menuDropdown { display: none; position: absolute; top: 50px; left: 16px; background: #1c1c1e; border: 1px solid #38383a; border-radius: 12px; z-index: 50; width: 220px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
#menuDropdown button { width: 100%; text-align: left; padding: 12px 16px; font-size: 14px; color: #f2f2f7; background: none; border: 0; cursor: pointer; }
#menuDropdown button:hover { background: #2c2c2e; }
</style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen p-4 relative">

<!-- Inlog Scherm (Wordt getoond als je niet bent ingelogd) -->
<div id="authContainer" class="max-w-md mx-auto mt-20 bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4 shadow-xl">
 <h2 class="text-xl font-bold text-sky-400 text-center">🎯 Marktplaats Sniper Login</h2>
 <p class="text-xs text-slate-400 text-center">Log in om je persoonlijke snipers op al je apparaten te synchroniseren.</p>
 <div class="space-y-3">
  <input id="authUsername" type="text" placeholder="Gebruikersnaam" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
  <input id="authPassword" type="password" placeholder="Wachtwoord" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
  <div class="flex gap-2 pt-2">
   <button id="loginBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-semibold py-2.5">Inloggen</button>
   <button id="registerBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 text-sky-400 border border-slate-700 rounded-lg text-sm font-semibold py-2.5">Registreren</button>
  </div>
 </div>
</div>

<!-- Hoofd Applicatie (Wordt pas getoond na inloggen) -->
<div id="appContainer" class="max-w-5xl mx-auto space-y-4 hidden">

<header class="flex flex-wrap items-center justify-between gap-3 relative">
 <div class="flex items-center gap-3">
  <div class="relative">
   <button id="menuBtn" class="bg-slate-800 hover:bg-slate-700 text-sky-400 px-3 py-2 rounded-xl text-xl font-bold border border-slate-700 transition-colors shadow" title="Menu">⋮</button>
   <div id="menuDropdown">
    <button id="navScanner">📱 Live Scanner</button>
    <button id="navSnipers">🎯 Snipers Beheren</button>
    <button id="navTrash">🗑️ Prullenbak (Verwijderd)</button>
    <button id="logoutBtn" class="text-red-400 font-bold border-t border-slate-800">🚪 Uitloggen</button>
   </div>
  </div>
  <h1 id="pageTitle" class="text-xl md:text-2xl font-bold">🎯 Multi-Sniper Scanner</h1>
 </div>

 <div class="flex items-center gap-3">
  <button id="pushoverToggleBtn" class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all bg-emerald-600 border-emerald-500 text-white shadow">
   🔔 Pushover: AAN
  </button>
  <div id="scannerControls" class="flex items-center gap-3 text-sm">
   <span id="mode" class="px-2 py-1 rounded bg-slate-800">…</span>
   <span>Scan: <b id="cd" class="text-emerald-400 tabular-nums">5</b>s</span>
   <button id="scanNow" class="px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-medium">Scan nu</button>
  </div>
 </div>
</header>

<p id="subText" class="text-xs text-slate-400">Jouw persoonlijke live resultaten gesynchroniseerd met je account.</p>

<div id="scannerView" class="space-y-4">
 <div id="list" class="space-y-3"></div>
</div>

<div id="snipersView" class="hidden space-y-4">
 <section class="bg-slate-900 rounded-xl p-4 border border-slate-800 space-y-3">
  <h2 class="font-semibold text-sm text-sky-400">🎯 Nieuwe Sniper Instellen</h2>
  <div class="grid md:grid-cols-3 gap-2">
   <input id="snQuery" placeholder="Zoekterm (bv. Vespa sprint, Zip 2t, PS5...)" class="bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 md:col-span-3">
   <input id="snMin" type="number" placeholder="Min prijs €" class="bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200">
   <input id="snMax" type="number" placeholder="Max prijs €" class="bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200">
   <button id="addSniperBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white rounded text-sm font-semibold py-2">Voeg Sniper toe</button>
  </div>
 </section>
 <section class="bg-slate-900 rounded-xl p-4 border border-slate-800">
  <h2 class="font-semibold text-sm text-sky-400 mb-3">📋 Jouw Actieve Snipers</h2>
  <div id="snipersList" class="space-y-2"></div>
 </section>
</div>

<div id="trashView" class="hidden space-y-4">
 <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
  <h2 class="font-semibold text-sm text-sky-400">🗑️ Verwijderde Advertenties (Prullenbak)</h2>
  <button id="clearTrashBtn" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded text-xs font-semibold">Prullenbak Leegmaken</button>
 </div>
 <div id="trashList" class="space-y-3"></div>
</div>

</div>

<script>
let currentUserId = localStorage.getItem('mp_user_id');
const authContainer = document.getElementById('authContainer');
const appContainer = document.getElementById('appContainer');

if(currentUserId) {
 authContainer.classList.add('hidden');
 appContainer.classList.remove('hidden');
}

document.getElementById('registerBtn').onclick = async () => {
 const username = document.getElementById('authUsername').value.trim();
 const password = document.getElementById('authPassword').value;
 if(!username || !password) return alert('Vul alle velden in.');
 
 const res = await fetch('/api/register', {
  method: 'POST',
  headers: {'Content-Type': 'application/json'},
  body: JSON.stringify({username, password})
 });
 const data = await res.json();
 if(res.ok) {
  localStorage.setItem('mp_user_id', data.user_id);
  location.reload();
 } else {
  alert(data.error || 'Registreren mislukt.');
 }
};

document.getElementById('loginBtn').onclick = async () => {
 const username = document.getElementById('authUsername').value.trim();
 const password = document.getElementById('authPassword').value;
 if(!username || !password) return alert('Vul alle velden in.');
 
 const res = await fetch('/api/login', {
  method: 'POST',
  headers: {'Content-Type': 'application/json'},
  body: JSON.stringify({username, password})
 });
 const data = await res.json();
 if(res.ok) {
  localStorage.setItem('mp_user_id', data.user_id);
  location.reload();
 } else {
  alert(data.error || 'Onjuiste gegevens.');
 }
};

document.getElementById('logoutBtn').onclick = () => {
 localStorage.removeItem('mp_user_id');
 location.reload();
};

const menuBtn = document.getElementById('menuBtn');
const menuDropdown = document.getElementById('menuDropdown');
const scannerView = document.getElementById('scannerView');
const snipersView = document.getElementById('snipersView');
const trashView = document.getElementById('trashView');
const pageTitle = document.getElementById('pageTitle');
const subText = document.getElementById('subText');
const scannerControls = document.getElementById('scannerControls');
const pushoverToggleBtn = document.getElementById('pushoverToggleBtn');

if(menuBtn) menuBtn.onclick = () => menuDropdown.style.display = menuDropdown.style.display === 'block' ? 'none' : 'block';

async function fetchPushoverStatus() {
 try {
  const res = await fetch('/api/pushover-status');
  const data = await res.json();
  updatePushoverButton(data.active);
 } catch(e){}
}

function updatePushoverButton(active) {
 if(active) {
  pushoverToggleBtn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all bg-emerald-600 border-emerald-500 text-white shadow";
  pushoverToggleBtn.textContent = "🔔 Pushover: AAN";
 } else {
  pushoverToggleBtn.className = "px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all bg-slate-800 border-slate-700 text-slate-400 shadow";
  pushoverToggleBtn.textContent = "🔕 Pushover: UIT";
 }
}

if(pushoverToggleBtn) {
 pushoverToggleBtn.onclick = async () => {
  const newState = !pushoverToggleBtn.textContent.includes("AAN");
  const res = await fetch('/api/pushover-toggle', {
   method: 'POST',
   headers: {'Content-Type': 'application/json'},
   body: JSON.stringify({ active: newState })
  });
  const data = await res.json();
  updatePushoverButton(data.active);
 };
}
fetchPushoverStatus();

function switchView(view) {
 menuDropdown.style.display = 'none';
 scannerView.classList.add('hidden');
 snipersView.classList.add('hidden');
 trashView.classList.add('hidden');
 scannerControls.classList.add('hidden');

 if(view === 'scanner') {
  scannerView.classList.remove('hidden');
  scannerControls.classList.remove('hidden');
  pageTitle.textContent = '🎯 Multi-Sniper Scanner';
 } else if(view === 'snipers') {
  snipersView.classList.remove('hidden');
  pageTitle.textContent = '🎯 Snipers Beheren';
  loadSnipers();
 } else if(view === 'trash') {
  trashView.classList.remove('hidden');
  pageTitle.textContent = '🗑️ Prullenbak';
  loadTrash();
 }
}

document.getElementById('navScanner').onclick = () => switchView('scanner');
document.getElementById('navSnipers').onclick = () => switchView('snipers');
document.getElementById('navTrash').onclick = () => switchView('trash');

async function getStoredSnipers() {
 try {
  const res = await fetch('/api/snipers/get', {
   method: 'POST',
   headers: {'Content-Type': 'application/json'},
   body: JSON.stringify({ user_id: currentUserId })
  });
  return await res.json();
 } catch(e) { return []; }
}

async function loadSnipers() {
 const snipers = await getStoredSnipers();
 let h = '';
 if(!snipers.length) { h = '<p class="text-xs text-slate-400">Nog geen snipers ingesteld.</p>'; }
 snipers.forEach(s => {
  h += `<div class="flex justify-between items-center bg-slate-800 p-3 rounded-lg text-sm border border-slate-700">
   <div><b>🔍 ${s.query}</b><br><small class="text-xs text-slate-400">Prijs: €${s.minPrice||0} t/m €${s.maxPrice||'Onbeperkt'}</small></div>
   <button onclick="deleteSniper('${s.id}')" class="text-red-400 font-bold hover:text-red-300">Verwijder</button>
  </div>`;
 });
 document.getElementById('snipersList').innerHTML = h;
}

document.getElementById('addSniperBtn').onclick = async () => {
 const query = document.getElementById('snQuery').value.trim();
 const minPrice = document.getElementById('snMin').value;
 const maxPrice = document.getElementById('snMax').value;
 if(!query) return alert('Vul een zoekterm in.');
 
 const sniper = { id: String(Date.now()), query, minPrice, maxPrice };
 await fetch('/api/snipers/add', {
  method: 'POST',
  headers: {'Content-Type': 'application/json'},
  body: JSON.stringify({ user_id: currentUserId, sniper })
 });

 document.getElementById('snQuery').value = '';
 document.getElementById('snMin').value = '';
 document.getElementById('snMax').value = '';
 loadSnipers();
 alert('Sniper ingesteld!');
};

window.deleteSniper = async (id) => {
 await fetch('/api/snipers/delete', {
  method: 'POST',
  headers: {'Content-Type': 'application/json'},
  body: JSON.stringify({ user_id: currentUserId, id })
 });
 loadSnipers();
};

const deals = new Map();
const allCachedDeals = new Map();
const listEl = id('list');
function id(n){return document.getElementById(n);}

async function getIgnoredIds() {
 try {
  const res = await fetch('/api/ignored/get', {
   method: 'POST',
   headers: {'Content-Type': 'application/json'},
   body: JSON.stringify({ user_id: currentUserId })
  });
  return await res.json();
 } catch(e) { return []; }
}

async function removeDeal(itemId) {
 await fetch('/api/ignored/add', {
  method: 'POST',
  headers: {'Content-Type': 'application/json'},
  body: JSON.stringify({ user_id: currentUserId, item_id: itemId })
 });
 deals.delete(itemId);
 const el = document.querySelector(`[data-id="${itemId}"]`); if(el) el.remove();
}

async function loadTrash() {
 const trashListEl = document.getElementById('trashList');
 trashListEl.innerHTML = '';
 const ignoredIds = await getIgnoredIds();
 
 if(!ignoredIds.length) {
  trashListEl.innerHTML = '<p class="text-xs text-slate-400">De prullenbak is leeg.</p>';
  return;
 }

 ignoredIds.forEach(idVal => {
  const raw = allCachedDeals.get(idVal);
  const title = raw ? raw.title : `Advertentie ID: ${idVal}`;
  const url = raw ? raw.url : `https://www.marktplaats.nl`;
  const price = raw ? raw.price_display : '';
  const image = raw ? raw.image : '';

  const el = document.createElement('div');
  el.className = 'bg-slate-900 border border-slate-800 rounded-xl p-4 flex justify-between items-center gap-3';
  el.innerHTML = `
   <div class="flex gap-3 items-center min-w-0">
    ${image ? `<img src="${image}" class="w-12 h-12 rounded-lg object-cover bg-slate-800 shrink-0">` : ''}
    <div class="min-w-0">
     <div class="font-semibold truncate text-sm"><a class="hover:underline text-sky-400" target="_blank" href="${url}">${title}</a></div>
     <div class="text-xs text-slate-400 mt-0.5">Vraagprijs: <b class="text-white">${price}</b></div>
    </div>
   </div>
   <span class="text-xs text-slate-500">Verwijderd</span>
  `;
  trashListEl.appendChild(el);
 });
}

document.getElementById('clearTrashBtn').onclick = async () => {
 if(confirm('Weet je zeker dat je de prullenbak wilt legen?')) {
  await fetch('/api/ignored/clear', {
   method: 'POST',
   headers: {'Content-Type': 'application/json'},
   body: JSON.stringify({ user_id: currentUserId })
  });
  loadTrash();
 }
};

async function addDeal(raw) {
 allCachedDeals.set(raw.id, raw);
 if(deals.has(raw.id)) return;
 
 const ignoredIds = await getIgnoredIds();
 if(ignoredIds.includes(raw.id)) return;

 deals.set(raw.id, raw);
 const el = document.createElement('div');
 el.dataset.id = raw.id;
 el.className = 'bg-slate-900 border border-slate-800 rounded-xl p-4 relative';
 el.innerHTML = `
  <div class="flex gap-3 items-start">
   ${raw.image ? `<img src="${raw.image}" class="w-16 h-16 rounded-lg object-cover bg-slate-800 shrink-0">` : ''}
   <div class="flex-grow min-w-0">
    <div class="flex flex-wrap justify-between items-start gap-2">
     <div class="font-semibold truncate pr-6"><a class="hover:underline text-sky-400" target="_blank" href="${raw.url}">${raw.title}</a></div>
     <button onclick="removeDeal('${raw.id}')" class="text-slate-400 hover:text-red-400 font-bold" title="Verwijder">✕</button>
    </div>
    <div class="text-xs text-slate-400 mt-1">Zoekopdracht: <b class="text-emerald-400">${raw.query}</b> · Vraagprijs: <b class="text-white">${raw.price_display}</b></div>
   </div>
  </div>`;
 listEl.prepend(el);
}

async function scan() {
 if(!currentUserId) return;
 let live = false;
 try {
  const snipers = await getStoredSnipers();
  if(snipers.length > 0) {
   const res = await fetch('/api/scan-item', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ user_id: currentUserId, snipers })
   });
   if(res.ok) {
    const jsonDeals = await res.json();
    jsonDeals.reverse().forEach(d => addDeal(d));
    live = true;
   }
  } else {
   live = true;
  }
 } catch(e){}
 const modeEl = document.getElementById('mode');
 if(modeEl) modeEl.textContent = live ? '🟢 Account Gesynchroniseerd' : '🧪 Wachten...';
}

if(currentUserId) {
 let left = 5;
 setInterval(async () => {
  left--; if(left <= 0) { left = 5; await scan(); }
  const cdEl = document.getElementById('cd'); if(cdEl) cdEl.textContent = left;
 }, 1000);
 document.getElementById('scanNow').onclick = async () => { left = 5; await scan(); };
 scan();
}
</script>
</body>
</html>
